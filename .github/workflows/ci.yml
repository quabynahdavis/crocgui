name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (SvelteKit + Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: bun.lock

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: ./node_modules/.bin/svelte-kit sync && ./node_modules/.bin/svelte-check --no-tsconfig --ignore "node_modules"

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

  backend:
    name: Backend (Rust + Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check
        working-directory: src-tauri
        run: cargo check

      - name: Run tests
        working-directory: src-tauri
        run: cargo test
